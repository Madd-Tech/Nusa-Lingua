<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -40 440 440" width="440" height="440"><style>
.blink{transform-origin:200px 198px;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.nod{animation:nod 1.2s ease-in-out infinite}
@keyframes nod{0%,100%{transform:translateY(0)}30%{transform:translateY(12px)}55%{transform:translateY(0)}78%{transform:translateY(7px)}}
.wave{animation:wave .6s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(14deg)}to{transform:rotate(-22deg)}}
.hop{transform-origin:200px 360px;animation:hop .9s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.06,.92)}18%{transform:translateY(-14px) scale(.97,1.05)}50%{transform:translateY(-44px) scale(.97,1.05)}82%{transform:translateY(-14px) scale(.97,1.05)}}
.shadowhop{transform-origin:200px 376px;animation:sh .9s ease-in-out infinite}
@keyframes sh{0%,100%{transform:scale(1.05)}50%{transform:scale(.62)}}
.talk{transform-origin:200px 252px;animation:talk .35s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.2)}to{transform:scaleY(1.15)}}
.pop{transform-origin:315px 84px;animation:pop 2.4s ease-in-out infinite}
@keyframes pop{0%,8%{transform:scale(0)}18%,86%{transform:scale(1)}100%{transform:scale(0)}}
.flapl{animation:flapl .45s ease-in-out infinite alternate}
.flapr{animation:flapr .45s ease-in-out infinite alternate}
@keyframes flapl{from{transform:rotate(10deg)}to{transform:rotate(-18deg)}}
@keyframes flapr{from{transform:rotate(-10deg)}to{transform:rotate(18deg)}}
.fall{transform-box:fill-box;transform-origin:center;animation:fall 2.4s linear infinite;opacity:0}
@keyframes fall{0%{transform:translateY(-10px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(250px) rotate(300deg);opacity:0}}


.blink2{transform-origin:200px 162px;animation:blink 4s infinite}
.ytalk{transform-origin:200px 206px;animation:ytalk .3s ease-in-out infinite alternate}
@keyframes ytalk{from{transform:scaleY(.35)}to{transform:scaleY(1.1)}}
.jig{animation:jig .22s ease-in-out infinite alternate}
@keyframes jig{from{transform:translateY(0)}to{transform:translateY(-7px)}}
.nod2{animation:nod2 1.4s ease-in-out infinite}
@keyframes nod2{0%,100%{transform:translateY(0)}30%{transform:translateY(9px)}60%{transform:translateY(0)}80%{transform:translateY(5px)}}
.pop2{transform-origin:351px 44px;animation:pop 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pop2{transform:scale(1)}.fall{opacity:1}}

.dot{animation:dot 1s ease-in-out infinite}
@keyframes dot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-9px)}}
.wv{animation:wv 1.4s ease-out infinite;opacity:0}
@keyframes wv{0%{opacity:0}25%{opacity:1}70%,100%{opacity:0}}
.tapl{animation:tap .28s ease-in-out infinite alternate}
.tapr{animation:tap .28s ease-in-out infinite alternate;animation-delay:.14s}
@keyframes tap{from{transform:rotate(0)}to{transform:rotate(8deg)}}
@media (prefers-reduced-motion:reduce){.wv{opacity:1}}

.breath{transform-origin:200px 386px;animation:breath 3.2s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.03)}}
.clapl{animation:clapl .28s ease-in-out infinite alternate}
.clapr{animation:clapr .28s ease-in-out infinite alternate}
@keyframes clapl{from{transform:rotate(0)}to{transform:rotate(16deg)}}
@keyframes clapr{from{transform:rotate(0)}to{transform:rotate(-16deg)}}
.bow{transform-origin:200px 386px;animation:bow 2.6s ease-in-out infinite}
@keyframes bow{0%,15%,100%{transform:translateY(0) scale(1,1)}45%,65%{transform:translateY(11px) scale(1.03,.93)}}
.startle{transform-origin:200px 386px;animation:startle 2.4s ease-out infinite}
@keyframes startle{0%,55%,100%{transform:translateY(0) scale(1,1)}6%{transform:translateY(-30px) scale(.96,1.05)}16%{transform:translateY(0) scale(1.05,.94)}26%{transform:translateY(-9px) scale(1,1)}36%{transform:translateY(0)}}
.droop{transform-origin:200px 386px;animation:droop 3s ease-in-out infinite alternate}
@keyframes droop{from{transform:translateY(0) scale(1,1)}to{transform:translateY(8px) scale(1.02,.96)}}
.hop2{animation:hop2 .3s ease-in-out infinite alternate}
@keyframes hop2{from{transform:translateY(0)}to{transform:translateY(-9px)}}
.zf{opacity:0;animation:zf 2.4s ease-in-out infinite}
@keyframes zf{0%{opacity:0;transform:translateY(10px)}25%,70%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.glow{transform-origin:300px 58px;animation:glow .9s ease-in-out infinite alternate}
@keyframes glow{from{transform:scale(.92)}to{transform:scale(1.14)}}
.shrugl{animation:shl .6s ease-in-out infinite alternate}
.shrugr{animation:shr .6s ease-in-out infinite alternate}
@keyframes shl{from{transform:rotate(0)}to{transform:rotate(18deg)}}
@keyframes shr{from{transform:rotate(0)}to{transform:rotate(-18deg)}}
.qp{transform-box:fill-box;transform-origin:center;animation:qp 1.1s ease-in-out infinite alternate}
@keyframes qp{from{transform:scale(.94)}to{transform:scale(1.1)}}
.flick{animation:flick .9s ease-in-out infinite alternate}
@keyframes flick{from{opacity:1}to{opacity:.3}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 1s ease-in-out infinite alternate}
@keyframes tw{from{transform:scale(.88) rotate(-6deg)}to{transform:scale(1.12) rotate(8deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.zf{opacity:1}}

.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rock{transform-origin:200px 386px;animation:rock 4s ease-in-out infinite}
@keyframes rock{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
