<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Acil Imah memberi salam"><title>Acil Imah memberi salam</title><style>.char{transform-origin:256px 470px;animation:breathe 4.2s ease-in-out infinite}
